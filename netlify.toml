# Tells Netlify where the site and the function live in this folder.

[build]
  publish = "."
  functions = "netlify/functions"

# Single-page app: every path serves index.html.
# The /api/* exclusion matters — without it this rule would swallow
# the function call and return HTML instead of a reply.
[[redirects]]
  from = "/api/*"
  to = "/api/:splat"
  status = 200
  force = false

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
