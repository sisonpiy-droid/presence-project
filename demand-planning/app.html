<body>
<div class="w">
<h1>Reorder Desk</h1>
<div class="mute">Freshroots demand planning. Recommends only: nothing here places a PO. Raghav approves or overrides every row.</div>

<div class="card">
 <div class="row">
  <button class="p" id="sample">Load sample data</button>
  <label>Weekly sales <input type="file" id="f-sales" accept=".csv"></label>
  <label>SKU master <input type="file" id="f-master" accept=".csv"></label>
  <label>Inventory <input type="file" id="f-inv" accept=".csv"></label>
  <label>Calendar <input type="file" id="f-cal" accept=".csv"></label>
 </div>
 <div class="row" style="margin-top:10px">
  <span id="asof" class="mute"></span><span class="grow"></span>
  <label><input type="checkbox" id="fest"> Festival uplift</label>
 </div>
 <details style="margin-top:10px"><summary>Rules (Raghav's thresholds, editable)</summary><div class="g" id="rules"></div></details>
</div>

<div id="app"></div>
</div>

<script id="core">
const R0={hd:1.2,mult:1.5,uplift:1.25,loMin:6,loMax:14,hiMin:3,hiMax:4,drop:0.8,hist:12};
const LABEL={hd:'High-demand: last 4 wks vs 12-wk avg (x)',mult:'High-demand reorder multiplier',uplift:'Festival demand uplift (x)',
loMin:'Normal SKU min weeks cover',loMax:'Normal SKU max weeks cover',hiMin:'Perishable min weeks cover',hiMax:'Perishable max weeks cover',
drop:'Sharp-drop flag below (x of 12-wk avg)',hist:'Min weeks of history'};

function parseCSV(t){
  const rows=[];let r=[],c='',q=false;
  for(let i=0;i<t.length;i++){const ch=t[i];
    if(q){if(ch=='"'){if(t[i+1]=='"'){c+='"';i++}else q=false}else c+=ch}
    else if(ch=='"')q=true;else if(ch==','){r.push(c);c=''}
    else if(ch=='\n'||ch=='\r'){if(ch=='\r'&&t[i+1]=='\n')i++;r.push(c);c='';if(r.length>1||r[0]!=='')rows.push(r);r=[]}
    else c+=ch}
  if(c!==''||r.length){r.push(c);rows.push(r)}
  const h=rows.shift().map(s=>s.trim());
  return rows.map(r=>Object.fromEntries(h.map((k,i)=>[k,(r[i]||'').trim()])));
}

function recommend(sku,weekly,onHand,fest,R){
  const l12=weekly.slice(-12),l4=weekly.slice(-4),avg=a=>a.reduce((x,y)=>x+y,0)/a.length;
  const avg12=avg(l12),avg4=avg(l4),adj=avg12*(fest?R.uplift:1),cover=onHand/adj;
  const perish=sku.Perishability==='High',lo=perish?R.hiMin:R.loMin,hi=perish?R.hiMax:R.loMax;
  const stockout=cover<lo,over=cover>hi,high=avg4>R.hd*avg12,std=+sku.Standard_Reorder_Qty,flags=[];
  let call,qty,reason;
  if(over&&high){call='Review';qty=0;reason=`Conflict: overstock (${cover.toFixed(1)} wks > ${hi}) but demand rising`;flags.push('conflicting signals')}
  else if(stockout){qty=high?Math.trunc(std*R.mult):std;call='Reorder now';reason=`Cover ${cover.toFixed(1)} wks < ${lo}`+(high?` and demand high: ${R.mult}x`:'')}
  else if(high){call='Reorder 1.5x';qty=Math.trunc(std*R.mult);reason=`Last 4 wks ${((avg4/avg12-1)*100).toFixed(0)}% vs 12-wk avg`}
  else if(over){call='Pause order';qty=0;reason=`Cover ${cover.toFixed(1)} wks > ${hi}`}
  else{call='OK';qty=0;reason=`Cover ${cover.toFixed(1)} wks within ${lo}-${hi}`}
  if(avg4<R.drop*avg12)flags.push('sharp drop: competitor scheme?');
  if(weekly.length<R.hist)flags.push('short history: new launch?');
  return{id:sku.SKU_ID,name:sku.SKU_Name,dist:sku.Distributor_ID,perish,onHand,avg4,avg12,cover,lo,hi,call,qty,reason,flags,weekly};
}

function compute(D,R,festOverride){
  const sales={};
  D.sales.slice().sort((a,b)=>a.SKU_ID<b.SKU_ID?-1:a.SKU_ID>b.SKU_ID?1:a.Week<b.Week?-1:1)
    .forEach(r=>(sales[r.SKU_ID]=sales[r.SKU_ID]||[]).push(+r.Units_Sold));
  const inv=Object.fromEntries(D.inv.map(r=>[r.SKU_ID,r]));
  const fest=Object.fromEntries(D.cal.map(r=>[r.Year_Month,r.Is_Festival_Month.toUpperCase()==='TRUE']));
  const rows=[];let asof='',f=false;
  for(const s of D.master){const i=inv[s.SKU_ID];if(!i||!sales[s.SKU_ID])continue;
    asof=i.As_Of_Date;f=festOverride===null?!!fest[asof.slice(0,7)]:festOverride;
    rows.push(recommend(s,sales[s.SKU_ID],+i.Units_On_Hand,f,R))}
  return{rows,asof,fest:f,defaultFest:!!fest[asof.slice(0,7)]};
}
</script>

}

function spark(w){
  const W=96,H=24,mx=Math.max(...w),mn=Math.min(...w),y=v=>H-2-(mx===mn?H/2-2:(v-mn)/(mx-mn)*(H-4)),x=i=>i/(w.length-1)*W;
  const p=w.map((v,i)=>`${x(i).toFixed(1)},${y(v).toFixed(1)}`),k=p.slice(-4).join(' ');
  return`<svg width="${W}" height="${H}"><polyline points="${p.join(' ')}" fill="none" stroke="var(--mute)" stroke-width="1.2"/><polyline points="${k}" fill="none" stroke="var(--acc)" stroke-width="2"/></svg>`;
}
function bar(r){
  const W=130,mx=Math.max(r.hi*1.6,r.cover*1.1),s=v=>v/mx*W;
  return`<svg width="${W}" height="16"><rect x="0" y="5" width="${W}" height="6" rx="3" fill="var(--line)"/>
  <rect x="${s(r.lo)}" y="3" width="${s(r.hi)-s(r.lo)}" height="10" rx="2" fill="var(--ok)"/>
  <circle cx="${Math.min(s(r.cover),W-4)}" cy="8" r="4.5" fill="var(--ink)"/></svg>`;
}

function render(){
  const rows=res.rows.slice().sort((a,b)=>ORDER.indexOf(a.call)-ORDER.indexOf(b.call)||a.cover-b.cover);
  const cnt={};rows.forEach(r=>cnt[r.call]=(cnt[r.call]||0)+1);
  const dec=rows.map(r=>decisions[key(r)]).filter(Boolean),ov=dec.filter(d=>d.status==='overridden').length,rate=dec.length?ov/dec.length:0;
  const needs=rows.filter(r=>r.flags.length).length,buy=rows.reduce((a,r)=>a+(r.call.startsWith('Reorder')?r.qty:0),0);
  const killed=dec.length>=5&&rate>0.4;
  const shown=rows.filter(r=>filter==='all'||(filter==='flag'?r.flags.length:r.call===filter));
  $('#app').innerHTML=`
  <div class="tiles">${ORDER.filter(c=>cnt[c]).map(c=>`<div class="tile b-${CLS[c]}"><b>${cnt[c]}</b>${c}</div>`).join('')}
   <div class="tile card" style="margin:0"><b>${buy.toLocaleString()}</b>units recommended</div>
   <div class="tile card" style="margin:0"><b>${needs}</b>need Raghav's judgment</div></div>
  <div class="card"><div class="row"><h2 class="grow" style="margin:0">Override rate (kill criterion: stop and redesign above 40%)</h2>
   <b>${dec.length?Math.round(rate*100)+'%':'no decisions yet'}</b></div>
   <div class="gauge"><i class="${killed?'bad':''}" style="width:${rate*100}%"></i><u style="left:40%"></u></div>
   <div class="sn" style="margin-top:6px">${dec.length} of ${rows.length} rows decided · ${ov} overridden.${killed?' <b style="color:var(--nowi)">Over 40%: the rules need redesign, not more runs.</b>':''}
   A high override rate means the rules are wrong, which is the real-world signal this tool is built to surface.</div></div>
  <div class="card"><div class="row chips" style="margin-bottom:8px">
   ${['all','flag',...ORDER].map(f=>`<button data-f="${f}" class="${filter===f?'on':''}">${f==='all'?'All':f==='flag'?'Needs Raghav':f}</button>`).join('')}
   <span class="grow"></span><button data-act="approveAll">Approve all shown</button>
   <button class="p" data-act="exportOrders">Export approved orders</button><button data-act="exportLog">Export decision log</button></div>
  <div class="wrap"><table><tr><th>SKU<th>Last 16 wks<th>On hand<th>Weeks cover (green = target)<th>Call<th>Qty<th>Why<th>Decision</tr>
  ${shown.map(r=>{const d=decisions[key(r)],ed=editing.has(r.id);return`<tr>
   <td><b>${esc(r.id)}</b>${r.perish?' <span class="sn">perishable</span>':''}<div class="sn">${esc(r.name)}</div></td>
   <td>${spark(r.weekly)}</td><td>${r.onHand.toLocaleString()}</td>
   <td>${bar(r)}<div class="sn">${r.cover.toFixed(1)} wks · target ${r.lo}-${r.hi}</div></td>
   <td><span class="badge b-${CLS[r.call]}">${r.call}</span></td><td>${r.qty||''}</td>
   <td>${esc(r.reason)}${r.flags.map(f=>`<div class="flag">⚑ ${esc(f)}</div>`).join('')}</td>
   <td>${d?`<span class="st ${d.status==='approved'?'a':'o'}">${d.status==='approved'?'Approved':'Overridden: '+esc(d.call)+(d.call.startsWith('Reorder')?' '+d.qty:'')}</span>${d.note?`<div class="sn">${esc(d.note)}</div>`:''}<div><button data-act="undo" data-id="${r.id}">Undo</button></div>`
     :`<button data-act="approve" data-id="${r.id}">Approve</button> <button data-act="edit" data-id="${r.id}">Override</button>`}
    ${ed&&!d?`<div class="ed"><select id="c-${r.id}">${ORDER.filter(c=>c!=='Review').map(c=>`<option${c===r.call?' selected':''}>${c}</option>`).join('')}</select>
     <input type="number" id="q-${r.id}" value="${r.qty}" min="0"><input type="text" id="n-${r.id}" placeholder="Why? (optional)">
     <button class="p" data-act="saveOv" data-id="${r.id}">Save</button></div>`:''}</td></tr>`}).join('')}
  </table></div></div>`;
}

function csvOut(name,header,lines){
  const q=v=>/[",\n]/.test(v)?'"'+String(v).replace(/"/g,'""')+'"':v,
  b=new Blob([[header,...lines].map(l=>l.map(q).join(',')).join('\n')],{type:'text/csv'}),a=document.createElement('a');
  a.href=URL.createObjectURL(b);a.download=name;a.click();URL.revokeObjectURL(a.href);
}
document.addEventListener('click',e=>{
  const t=e.target.closest('button');if(!t||!res)return;
  if(t.dataset.f){filter=t.dataset.f;return render()}
  const id=t.dataset.id,r=res.rows.find(x=>x.id===id),act=t.dataset.act;
  if(act==='approve')decisions[key(r)]={status:'approved',call:r.call,qty:r.qty,recCall:r.call,recQty:r.qty,at:new Date().toISOString()};
  else if(act==='edit'){editing.add(id);return render()}
  else if(act==='saveOv'){const call=$('#c-'+id).value,qty=call.startsWith('Reorder')?+$('#q-'+id).value||0:0;
    decisions[key(r)]={status:'overridden',call,qty,recCall:r.call,recQty:r.qty,note:$('#n-'+id).value,at:new Date().toISOString()};editing.delete(id)}
  else if(act==='undo'){delete decisions[key(r)]}
  else if(act==='approveAll'){res.rows.filter(x=>filter==='all'||(filter==='flag'?x.flags.length:x.call===filter)).forEach(x=>{
    if(!decisions[key(x)])decisions[key(x)]={status:'approved',call:x.call,qty:x.qty,recCall:x.call,recQty:x.qty,at:new Date().toISOString()}})}
  else if(act==='exportOrders'){return csvOut(`approved-orders-${res.asof}.csv`,['SKU_ID','SKU_Name','Distributor_ID','Order_Qty'],
    res.rows.filter(x=>{const d=decisions[key(x)];return d&&d.qty>0}).map(x=>[x.id,x.name,x.dist,decisions[key(x)].qty]))}
  else if(act==='exportLog'){return csvOut(`decision-log-${res.asof}.csv`,['As_Of','SKU_ID','Recommended','Rec_Qty','Status','Final_Call','Final_Qty','Note'],
    res.rows.filter(x=>decisions[key(x)]).map(x=>{const d=decisions[key(x)];return[res.asof,x.id,d.recCall,d.recQty,d.status,d.call,d.qty,d.note||'']}))}
  else return;
  store.set('rd-decisions',decisions);render();
});
loadSample();
</script>
</body>
</html>
